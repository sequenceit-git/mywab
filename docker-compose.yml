services:
  mongo:
    image: mongo:7
    container_name: wapbusiness-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: wapbusiness
    # Bound to localhost only — not exposed on the public VPS IP
    ports:
      - "127.0.0.1:27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wapbusiness-app
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DOMAIN=${DOMAIN:-dsdukan.cloud}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-https://dsdukan.cloud}
      # Docker DNS name `mongo` — overrides Atlas URI in .env
      - MONGODB_URI=mongodb://mongo:27017/wapbusiness
    labels:
      - "traefik.enable=true"

      # HTTP Router (port 80)
      - "traefik.http.routers.wapbusiness-http.rule=Host(`${DOMAIN:-dsdukan.cloud}`) || Host(`www.${DOMAIN:-dsdukan.cloud}`)"
      - "traefik.http.routers.wapbusiness-http.entrypoints=web"

      # HTTPS Router (port 443 with TLS)
      - "traefik.http.routers.wapbusiness-https.rule=Host(`${DOMAIN:-dsdukan.cloud}`) || Host(`www.${DOMAIN:-dsdukan.cloud}`)"
      - "traefik.http.routers.wapbusiness-https.entrypoints=websecure"
      - "traefik.http.routers.wapbusiness-https.tls=true"
      - "traefik.http.routers.wapbusiness-https.tls.certresolver=${CERT_RESOLVER:-letsencrypt}"

      # Container port for Traefik load balancer
      - "traefik.http.services.wapbusiness.loadbalancer.server.port=3000"

volumes:
  mongo_data:
